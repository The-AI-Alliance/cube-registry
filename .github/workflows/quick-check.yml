name: Entry Pipeline

# Pre-merge pipeline for `entries/*.yaml` PRs. Replaces the old
# `Quick Check` workflow (filename retained for branch-protection compatibility).
#
# Pipeline:
#   ownership-check → quick-compliance → slow-compliance → entry-review
#                                                          ├─ auto-merge (PASS + path-isolated + same-repo)
#                                                          └─ request-review (everything else)
#
# Slow-check.yml retains a post-merge `push` trigger as a redundant safety
# net (catches force-merge bypasses; health-check catches drift).

on:
  pull_request:
    branches: [main]

permissions:
  contents: write       # commit CI-derived fields back to PR branch
  pull-requests: write  # comment + label + auto-merge

jobs:
  # ── 1. Ownership check ─────────────────────────────────────────────────
  ownership-check:
    name: ownership-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4.2.2
        with:
          fetch-depth: 0  # full history for git show origin/main

      - name: Fetch origin/main
        run: git fetch origin main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@22103cc46bda19c2b464ffe86db46df6922fd323  # v47.0.5
        with:
          separator: " "

      - name: Run ownership check
        run: |
          # Pass changed-files unquoted so the shell word-splits into individual args.
          # Path-traversal and handle-format defences live in ownership_check.py itself.
          python scripts/ownership_check.py \
            --pr-author "${{ github.event.pull_request.user.login }}" \
            --changed-files ${{ steps.changed-files.outputs.all_changed_files }}

  # ── 2. Quick compliance check (no credentials, Docker sandbox) ─────────
  quick-compliance:
    name: quick-compliance
    runs-on: ubuntu-latest
    needs: ownership-check
    outputs:
      changed_entries:     ${{ steps.changed-entries.outputs.all_changed_files }}
      changed_entries_any: ${{ steps.changed-entries.outputs.any_changed }}
      path_isolated:       ${{ steps.classify-paths.outputs.path_isolated }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4.2.2
        with:
          fetch-depth: 0  # for diff-filter

      - name: Get changed entry files
        id: changed-entries
        uses: tj-actions/changed-files@22103cc46bda19c2b464ffe86db46df6922fd323  # v47.0.5
        with:
          files: "entries/*.yaml"
          separator: "\n"

      - name: Classify diff (entries-only + no deletes)
        id: classify-paths
        # Path-isolation gate for auto-merge eligibility. Mirrors results-check.yml.
        # Auto-merge requires the PR to strictly add or modify files under
        # entries/<id>.yaml — no deletes, no other paths touched.
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          # Any deletes/renames inside entries/?
          deleted=$(git diff --diff-filter=DR --name-only "$BASE_SHA" "$HEAD_SHA" -- 'entries/*' || true)

          # Anything touched outside entries/?
          non_entries=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            | grep -v '^entries/' || true)

          if [ -n "$deleted" ] || [ -n "$non_entries" ]; then
            echo "path_isolated=false" >> "$GITHUB_OUTPUT"
            echo "PR touches deleted/non-entry paths — auto-merge will be skipped."
          else
            echo "path_isolated=true" >> "$GITHUB_OUTPUT"
            echo "Diff is strictly entries/*.yaml additions/modifications."
          fi

      - name: Skip if no entry files changed
        if: steps.changed-entries.outputs.any_changed != 'true'
        run: |
          echo "No entry files changed. Skipping quick compliance check."
          exit 0

      - name: Set up Python (host — for orchestration only)
        if: steps.changed-entries.outputs.any_changed == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.3.0
        with:
          python-version: "3.12"

      - name: Install orchestration dependencies
        if: steps.changed-entries.outputs.any_changed == 'true'
        run: pip install jsonschema ruamel.yaml pyyaml

      - name: Run quick check for each changed entry
        if: steps.changed-entries.outputs.any_changed == 'true'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -e
          FAILED=0
          ENTRIES="${{ steps.changed-entries.outputs.all_changed_files }}"

          while IFS= read -r entry_file; do
            [ -z "$entry_file" ] && continue
            [ ! -f "$entry_file" ] && continue
            echo "=========================================="
            echo "Checking: $entry_file"
            echo "=========================================="

            # /derived is a writable host tmpdir mounted into the container.
            # quick_check.py writes the updated entry YAML there after introspection.
            # The workspace itself is mounted read-only — no credentials, no secrets.
            DERIVED_DIR=$(mktemp -d)

            docker run --rm \
              --memory 2g \
              --cpus 2 \
              --pids-limit 512 \
              --cap-drop NET_ADMIN \
              --cap-drop SYS_PTRACE \
              --cap-drop SYS_ADMIN \
              --security-opt no-new-privileges \
              -v "$(pwd):/workspace:ro" \
              -v "$DERIVED_DIR:/derived:rw" \
              python:3.12-slim \
              bash -c "
                set -e
                apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates
                pip install jsonschema 'ruamel.yaml' pyyaml
                cp -r /workspace /workspace-copy
                cd /workspace-copy
                python scripts/quick_check.py \
                  --entry '$entry_file' \
                  --pr-author '$PR_AUTHOR' \
                  --output-dir /derived
              " || { FAILED=1; rm -rf "$DERIVED_DIR"; continue; }

            # Copy the updated YAML (with CI-derived fields) back to the workspace.
            ENTRY_BASENAME=$(basename "$entry_file")
            if [ -f "$DERIVED_DIR/$ENTRY_BASENAME" ]; then
              cp "$DERIVED_DIR/$ENTRY_BASENAME" "$entry_file"
              echo "  Updated $entry_file with CI-derived fields"
            fi
            rm -rf "$DERIVED_DIR"
          done <<< "$ENTRIES"

          exit $FAILED

      - name: Commit CI-derived fields back to PR branch
        if: success() && steps.changed-entries.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only commit if there are changes to the entry YAMLs.
          if git diff --quiet -- entries/; then
            echo "No CI-derived field changes to commit."
            exit 0
          fi

          git config user.name  "cube-registry-bot"
          git config user.email "cube-registry-bot@users.noreply.github.com"
          git add entries/
          git commit -m "ci: write back derived fields from quick-check [skip ci]"

          # For same-repo PRs we can push directly to the head branch.
          # For fork PRs GITHUB_TOKEN cannot push to the fork; post a comment instead.
          HEAD_REPO="${{ github.event.pull_request.head.repo.full_name }}"
          BASE_REPO="${{ github.repository }}"

          if [ "$HEAD_REPO" = "$BASE_REPO" ]; then
            git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
            echo "Pushed derived fields to PR branch."
          else
            PATCH=$(git format-patch HEAD~1 --stdout | head -200)
            gh pr comment "${{ github.event.pull_request.number }}" \
              --repo "$BASE_REPO" \
              --body "$(printf '## CI-derived fields\n\nQuick-check introspected your package and derived the following fields.\nBecause this is a fork PR, apply the patch below to your branch:\n\n```diff\n%s\n```' "$PATCH")"
            git reset --hard HEAD~1
          fi

  # ── 3. Slow compliance (pre-merge benchmark execution) ─────────────────
  # Runs the actual debug task in a sandboxed environment.  No cloud
  # credentials are injected here — provisioning + credential-bearing steps
  # belong to a separate (future) `provision-infra` step per slow-check.yml.
  # For now, the script runs against `local` provider only (Docker on runner).
  slow-compliance:
    name: slow-compliance
    runs-on: ubuntu-latest
    needs: [ownership-check, quick-compliance]
    if: |
      success() &&
      needs.quick-compliance.outputs.changed_entries_any == 'true'
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.3.0
        with:
          python-version: "3.12"

      - name: Install orchestration dependencies
        run: pip install pyyaml "ruamel.yaml"

      - name: Run slow check for each changed entry
        env:
          ENTRIES: ${{ needs.quick-compliance.outputs.changed_entries }}
        run: |
          set -e
          while IFS= read -r entry_file; do
            [ -z "$entry_file" ] && continue
            [ ! -f "$entry_file" ] && continue
            echo "=========================================="
            echo "Slow check: $entry_file"
            echo "=========================================="
            # `local` provider only at PR-time. VM providers run post-merge
            # via slow-check.yml (no PR-author-controlled cloud spend).
            python scripts/slow_check.py \
              --entry "$entry_file" \
              --provider local
          done <<< "$ENTRIES"

  # ── 4. Entry review (LLM semantic check) ───────────────────────────────
  # Graceful-degrades to verdict=UNKNOWN when ANTHROPIC_API_KEY is unset,
  # which routes the PR to `request-review` (manual maintainer merge) — the
  # same fallback as today's flow.
  entry-review:
    name: entry-review
    runs-on: ubuntu-latest
    needs: [ownership-check, quick-compliance, slow-compliance]
    if: |
      success() &&
      needs.quick-compliance.outputs.changed_entries_any == 'true'
    outputs:
      verdict: ${{ steps.run.outputs.verdict }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout PR head
        # Pin to head.sha (not head.ref) to avoid racing with quick-compliance's
        # CI-derived-fields commit. The LLM review only consults human-authored
        # fields; deterministic CI fields don't change the verdict.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml anthropic

      - name: Run review for each changed entry
        id: run
        env:
          ENTRIES: ${{ needs.quick-compliance.outputs.changed_entries }}
        run: |
          set -e
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "ANTHROPIC_API_KEY not set — skipping LLM review (graceful degrade)"
            echo "verdict=UNKNOWN" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OVERALL="PASS"
          : > /tmp/entry-review-comment.md
          while IFS= read -r entry_file; do
            [ -z "$entry_file" ] && continue
            [ ! -f "$entry_file" ] && continue
            python scripts/entry_review.py \
              --entry "$entry_file" \
              --verdict-out "/tmp/verdict.json" \
              --comment-out "/tmp/comment.md"
            cat /tmp/comment.md >> /tmp/entry-review-comment.md
            echo >> /tmp/entry-review-comment.md
            VERDICT=$(python -c "import json; print(json.load(open('/tmp/verdict.json'))['verdict'])")
            if [ "$VERDICT" != "PASS" ]; then
              OVERALL="CONCERN"
            fi
          done <<< "$ENTRIES"

          echo "verdict=$OVERALL" >> "$GITHUB_OUTPUT"

      - name: Post review comment
        if: steps.run.outputs.verdict != 'UNKNOWN'
        env:
          GH_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_FULL: ${{ github.repository }}
        run: |
          if [ -s /tmp/entry-review-comment.md ]; then
            gh pr comment "$PR_NUMBER" --repo "$REPO_FULL" --body-file /tmp/entry-review-comment.md
          fi

  # ── 5. Auto-merge (verdict=PASS + path-isolated + same-repo) ───────────
  auto-merge:
    name: auto-merge
    runs-on: ubuntu-latest
    needs: [ownership-check, quick-compliance, slow-compliance, entry-review]
    if: |
      success() &&
      needs.quick-compliance.outputs.changed_entries_any == 'true' &&
      needs.quick-compliance.outputs.path_isolated == 'true' &&
      needs.entry-review.outputs.verdict == 'PASS' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Apply auto-merge label + enable native auto-merge
        env:
          GH_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_FULL: ${{ github.repository }}
        run: |
          gh pr edit "$PR_NUMBER" --repo "$REPO_FULL" --add-label "auto-merge"
          gh pr merge "$PR_NUMBER" --repo "$REPO_FULL" --auto --squash

  # ── 6. Request human review (fallback for everything else) ─────────────
  # Fires when auto-merge can't:
  #   - verdict != PASS (CONCERN, or UNKNOWN because ANTHROPIC_API_KEY unset)
  #   - PR comes from a fork (gh pr merge needs base-repo write)
  #   - PR diff touches non-entry paths or includes deletes
  # Same as today's behavior — apply ready-for-review label, await maintainer.
  request-review:
    name: request-human-review
    runs-on: ubuntu-latest
    needs: [ownership-check, quick-compliance, slow-compliance, entry-review]
    if: |
      success() &&
      needs.quick-compliance.outputs.changed_entries_any == 'true' &&
      (
        needs.entry-review.outputs.verdict != 'PASS' ||
        needs.quick-compliance.outputs.path_isolated != 'true' ||
        github.event.pull_request.head.repo.full_name != github.repository
      )
    steps:
      - name: Apply ready-for-review label
        env:
          GH_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_FULL: ${{ github.repository }}
          VERDICT:   ${{ needs.entry-review.outputs.verdict }}
          PATH_ISOLATED: ${{ needs.quick-compliance.outputs.path_isolated }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          gh pr edit "$PR_NUMBER" --repo "$REPO_FULL" --add-label "ready-for-review" || true

          REASONS=""
          if [ "$VERDICT" = "CONCERN" ]; then
            REASONS="${REASONS}- LLM review flagged a CONCERN (see comment above)\n"
          elif [ "$VERDICT" = "UNKNOWN" ]; then
            REASONS="${REASONS}- LLM review skipped (ANTHROPIC_API_KEY not configured)\n"
          fi
          if [ "$PATH_ISOLATED" != "true" ]; then
            REASONS="${REASONS}- PR touches paths outside \`entries/<id>.yaml\` or contains deletes/renames\n"
          fi
          if [ "$HEAD_REPO" != "$REPO_FULL" ]; then
            REASONS="${REASONS}- PR submitted from a fork (GITHUB_TOKEN cannot auto-merge)\n"
          fi

          gh pr comment "$PR_NUMBER" --repo "$REPO_FULL" --body "$(printf '✅ ownership-check, quick-compliance, slow-compliance passed.\n\nAuto-merge skipped because:\n\n%b\nA maintainer will review and merge.' "$REASONS")"
