name: Results Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  # ── Path-isolation gate ────────────────────────────────────────────────
  # Determines whether this PR is eligible for results auto-merge.
  # Eligible only if the diff strictly adds files under results/<cube-id>/*.json
  # and modifies/deletes nothing.
  classify:
    name: classify
    runs-on: ubuntu-latest
    outputs:
      added_results:           ${{ steps.added.outputs.all_changed_files }}
      added_results_any:       ${{ steps.added.outputs.any_changed }}
      modified_results:        ${{ steps.modified.outputs.all_changed_files }}
      modified_results_any:    ${{ steps.modified.outputs.any_changed }}
      non_results_any:         ${{ steps.non_results.outputs.any_changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4.2.2

      - name: Added result files
        id: added
        uses: tj-actions/changed-files@22103cc46bda19c2b464ffe86db46df6922fd323  # v47.0.5
        with:
          files: "results/*/*.json"
          files_ignore: "results/*/_*.json"
          separator: " "
          files_yaml: |
            results:
              - results/*/*.json
              - '!results/*/_*.json'

      - name: Modified or deleted result files (rejection signal)
        id: modified
        uses: tj-actions/changed-files@22103cc46bda19c2b464ffe86db46df6922fd323  # v47.0.5
        with:
          files: "results/**"
          separator: " "

      - name: Files changed outside results/
        id: non_results
        uses: tj-actions/changed-files@22103cc46bda19c2b464ffe86db46df6922fd323  # v47.0.5
        with:
          files_ignore: "results/**"
          separator: " "

  # ── Reject modify/delete inside results/ ───────────────────────────────
  # The journal is append-only. A PR that modifies or deletes anything in
  # results/ is rejected outright (no auto-merge, comment posted).
  reject-modify:
    name: reject-modify
    needs: classify
    if: needs.classify.outputs.added_results_any == 'false' && needs.classify.outputs.modified_results_any == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Post rejection comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body "❌ This PR modifies or deletes files in \`results/\`. The journal is append-only — corrections are made by submitting a new record with a \`supersedes\` reference."
          exit 1

  # ── Validate added result files ────────────────────────────────────────
  validate:
    name: validate
    needs: classify
    if: needs.classify.outputs.added_results_any == 'true'
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.run.outputs.passed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install jsonschema 'ruamel.yaml' pyyaml

      - name: Run validator
        id: run
        run: |
          set +e
          python scripts/results_check.py \
            --added ${{ needs.classify.outputs.added_results }} \
            --summary-out /tmp/results-summary.md
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi
          exit "$rc"

      - name: Post validation summary
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f /tmp/results-summary.md ]; then
            gh pr comment "${{ github.event.pull_request.number }}" \
              --repo "${{ github.repository }}" \
              --body-file /tmp/results-summary.md
          fi

  # ── Auto-merge eligibility ─────────────────────────────────────────────
  # The PR auto-merges iff:
  #   - At least one results file was added
  #   - No results files were modified or deleted (modify path is rejection-only)
  #   - Nothing outside results/ was touched
  #   - The validator passed every added file
  auto-merge:
    name: auto-merge
    needs: [classify, validate]
    if: |
      needs.classify.outputs.added_results_any == 'true' &&
      needs.classify.outputs.non_results_any == 'false' &&
      needs.validate.outputs.passed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Apply auto-merge label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --add-label "auto-merge"
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --auto --squash

  # ── Mixed PR: validator passes, but other files were touched ──────────
  # The result files are valid, but the PR also changes non-results paths.
  # Fall back to standard human review (no auto-merge).
  request-human-review:
    name: request-human-review
    needs: [classify, validate]
    if: |
      needs.classify.outputs.added_results_any == 'true' &&
      needs.classify.outputs.non_results_any == 'true' &&
      needs.validate.outputs.passed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Comment on mixed PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body "ℹ️ The added results files pass validation, but this PR also touches paths outside \`results/\`. Auto-merge is disabled — a maintainer will review."
