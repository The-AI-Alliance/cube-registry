id: waa
name: "WindowsAgentArena"
version: "0.1.0"
description: >
  Windows Agent Arena (WAA) benchmarks multimodal agents on real Windows 11
  desktop tasks across applications like File Explorer, Edge, Chrome, VLC, and
  settings. Each task launches a Windows VM, runs setup, and evaluates the final
  desktop state. Ported to the CUBE protocol.
package: waa-cube
dev_install_url: "git+https://github.com/The-AI-Alliance/cube-harness#subdirectory=cubes/windows-agent-arena-cube"

authors:
- github: recursix
  name: Alexandre Lacoste
- github: amanjaiswal73892
  name: Aman Jaiswal
- github: kushasareen
  name: Kusha Sareen

legal:
  wrapper_license: MIT

tags:
- os
- gui
- desktop
- multimodal

supported_infra: [azure]
getting_started_url: "https://github.com/The-AI-Alliance/cube-harness/tree/main/cubes/windows-agent-arena-cube"
parallelization_mode: benchmark-parallel
max_concurrent_tasks: 1
